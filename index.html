<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auto Changing Images</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .slider {
      width: 700px;
      max-width: 90%;
      height: 400px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }

    .slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="slider">
    <img id="slide" src="https://i.ibb.co/8g1rBh3g/6065510171-bb00e7222b-z.jpg" alt="Image Slider">
  </div>

  <script>
    // Image list
    const images = [
      "https://i.ibb.co/8g1rBh3g/6065510171-bb00e7222b-z.jpg",
      "https://i.ibb.co/WWsMQgj8/istockphoto-140472118-612x612.jpg",
      "https://i.ibb.co/6cY603tH/istockphoto-467294055-612x612.jpg"
    ];

    let index = 0;

    // Change image every 5 seconds
    setInterval(() => {
      index = (index + 1) % images.length;
      document.getElementById("slide").src = images[index];
    }, 5000);
  </script>

</body>
</html>
