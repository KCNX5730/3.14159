<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Image Slider</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      overflow:hidden;
      background:black;
    }

    .slider{
      width:100vw;
      height:100vh;
    }

    .slider img{
      width:100%;
      height:100%;
      object-fit:cover;
      transition:1s ease-in-out;
    }
  </style>
</head>
<body>

  <div class="slider">
    <img id="slide"
      src="https://i.ibb.co/8g1rBh3g/6065510171-bb00e7222b-z.jpg"
      alt="Fullscreen Image">
  </div>

  <script>
    const images = [
      "https://i.ibb.co/8g1rBh3g/6065510171-bb00e7222b-z.jpg",
      "https://i.ibb.co/WWsMQgj8/istockphoto-140472118-612x612.jpg",
      "https://i.ibb.co/6cY603tH/istockphoto-467294055-612x612.jpg"
    ];

    let index = 0;

    setInterval(() => {
      index = (index + 1) % images.length;
      document.getElementById("slide").src = images[index];
    }, 5000);
  </script>

</body>
</html>
